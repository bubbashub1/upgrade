name: BubbaHub Package and Google Sheet Check

on:
  push:
    branches: [ main, 'stage-*', 'staging-ready-*', 'fix-*' ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          set -e
          find assests/js -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done

      - name: Run static checks
        run: php tests/stage-8-import-static.php

      - name: Fetch Google Sheet CSV and report headers
        env:
          CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vRbtom1DcDeyoo10WCV_MIsjS8dm98zfxbL9Pf2oCOGYdX_Tl8kVOwDenhT01t4Rdq3nzA7dODJ-ZnV/pub?gid=0&single=true&output=csv
        run: |
          set -e
          curl --fail --location --silent --show-error "$CSV_URL" -o /tmp/groups.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path('/tmp/groups.csv')
          with p.open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.reader(f))
          if not rows:
              raise SystemExit('Google Sheet CSV is empty')
          headers = [h.strip() for h in rows[0]]
          print('GOOGLE SHEET COLUMN NAMES:')
          for i, h in enumerate(headers, 1):
              print(f'{i}. {h}')
          Path('google-sheet-headers.txt').write_text('\n'.join(headers) + '\n', encoding='utf-8')
          print(f'ROWS: {max(0, len(rows)-1)}')
          PY

      - name: Read plugin version
        id: version
        run: |
          set -e
          VERSION=$(sed -n "s/^ *\* Version: *//p" bubba-hub-production.php | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BubbaHub version: $VERSION"

      - name: Build plugin ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          rm -rf package "BubbaHub-${VERSION}.zip"
          mkdir -p package/bubba-hub-production
          cp bubba-hub-production.php package/bubba-hub-production/
          cp -R includes package/bubba-hub-production/
          cp -R assests package/bubba-hub-production/
          cp -R templates package/bubba-hub-production/
          find package -type f -name '*.zip' -delete
          cd package
          zip -qr "../BubbaHub-${VERSION}.zip" bubba-hub-production
          cd ..
          unzip -t "BubbaHub-${VERSION}.zip"

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BubbaHub-${{ steps.version.outputs.version }}
          path: BubbaHub-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Google headers report
        uses: actions/upload-artifact@v4
        with:
          name: Google-Sheet-Headers
          path: google-sheet-headers.txt
          if-no-files-found: error
          retention-days: 14
